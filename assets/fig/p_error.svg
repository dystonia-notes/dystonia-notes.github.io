<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="20" y="96" width="150" height="64" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.3" /><text x="95" y="124" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">반복으로</text><text x="95" y="143" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">굳은 패턴</text><rect x="214" y="20" width="330" height="64" rx="10" fill="#fff" stroke="#2f6f6a" stroke-width="1.3" /><text x="230" y="47" font-size="13" text-anchor="start" font-weight="600" fill="#1f2328">요구가 바뀌었는데 패턴이 따라가지 못함</text><text x="230" y="67" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">도구·테크닉의 변화, 피로 (Sadnicka 등)</text><line x1="172" y1="128" x2="210" y2="52" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><line x1="546" y1="52" x2="584" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="214" y="96" width="330" height="64" rx="10" fill="#fff" stroke="#2f6f6a" stroke-width="1.3" /><text x="230" y="123" font-size="13" text-anchor="start" font-weight="600" fill="#1f2328">알아차리지 못한 사이에 패턴이 흘러감</text><text x="230" y="143" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">주의가 닿지 않는 손 (유별의 가설)</text><line x1="172" y1="128" x2="210" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><line x1="546" y1="128" x2="584" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="214" y="172" width="330" height="64" rx="10" fill="#fff" stroke="#2f6f6a" stroke-width="1.3" /><text x="230" y="199" font-size="13" text-anchor="start" font-weight="600" fill="#1f2328">어느 세기를 넘으면 멈출 수 없음</text><text x="230" y="219" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">증상 역치 (Lu &amp; Pena)</text><line x1="172" y1="128" x2="210" y2="204" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><line x1="546" y1="204" x2="584" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="588" y="96" width="112" height="64" rx="10" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="1.3" /><text x="644" y="124" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">의도와</text><text x="644" y="143" font-size="13" text-anchor="middle" font-weight="600" fill="#fff">어긋남</text></svg>