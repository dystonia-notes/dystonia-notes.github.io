<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 328" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><rect x="140" y="14" width="584" height="40" fill="#f3f5f7" stroke="none"/><text x="213.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">보툴리눔 독소</text><text x="359.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">고주파 시상 절개술</text><text x="505.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">집속 초음파 시상 절개술</text><text x="651.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">뇌심부 자극술</text><line x1="16" y1="54" x2="724" y2="54" stroke="#d0d7de"/><text x="22" y="79" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">어디에</text><text x="213.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">손·팔 근육</text><text x="359.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵</text><text x="505.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵</text><text x="651.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵 (전극)</text><line x1="16" y1="94" x2="724" y2="94" stroke="#d0d7de"/><text x="22" y="119" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">몸에 남는 것</text><text x="213.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">오래 맞으면 위축</text><text x="359.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">작은 응고 부위</text><text x="505.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">작은 응고 부위</text><text x="651.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">전극과 자극기</text><line x1="16" y1="134" x2="724" y2="134" stroke="#d0d7de"/><text x="22" y="159" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">되돌릴 수 있나</text><text x="213.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">몇 달 뒤 사라짐</text><text x="359.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">아니오</text><text x="505.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">아니오</text><text x="651.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">끄거나 조절 가능</text><line x1="16" y1="174" x2="724" y2="174" stroke="#d0d7de"/><text x="22" y="199" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">효과 (대표 연구)</text><text x="213.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">음악가 69% 호전</text><text x="359.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">171명 중 98% 호전</text><text x="505.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">10명, 12개월 유지</text><text x="651.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">증례 몇 건</text><line x1="16" y1="214" x2="724" y2="214" stroke="#d0d7de"/><text x="22" y="239" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">대표적 대가</text><text x="213.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">주사 근육·주변의 힘 빠짐</text><text x="359.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">영구 부작용 3.5%</text><text x="505.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">발음 장애 1명</text><text x="651.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">수술·기기 관리</text><line x1="16" y1="254" x2="724" y2="254" stroke="#d0d7de"/><text x="22" y="279" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">근거</text><text x="213.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">위약 대조 시험 있음</text><text x="359.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">비교 없는 증례 모음</text><text x="505.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">소규모 예비 연구</text><text x="651.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">증례, 시험 진행 중</text><line x1="16" y1="294" x2="724" y2="294" stroke="#d0d7de"/><text x="360" y="316" font-size="11.5" text-anchor="middle" font-weight="400" fill="#656d76">숫자는 서로 다른 연구의 결과이며 직접 비교한 것이 아니다</text></svg>