<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 368" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><rect x="126" y="14" width="704" height="40" fill="#f3f5f7" stroke="none"/><text x="214.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">보툴리눔 독소</text><text x="390.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">고주파 시상 절개술</text><text x="566.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">집속 초음파 시상 절개술</text><text x="742.0" y="39" font-size="12.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">뇌심부 자극술</text><line x1="16" y1="54" x2="830" y2="54" stroke="#d0d7de"/><text x="22" y="79" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">어디에</text><text x="214.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">손·팔 근육</text><text x="390.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵</text><text x="566.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵</text><text x="742.0" y="79" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">시상 Vo 핵 (전극)</text><line x1="16" y1="94" x2="830" y2="94" stroke="#d0d7de"/><text x="22" y="119" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">몸에 남는 것</text><text x="214.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">오래 맞으면 위축</text><text x="390.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">작은 응고 부위</text><text x="566.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">작은 응고 부위</text><text x="742.0" y="119" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">전극과 자극기</text><line x1="16" y1="134" x2="830" y2="134" stroke="#d0d7de"/><text x="22" y="159" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">되돌릴 수 있나</text><text x="214.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">몇 달 뒤 효과 사라짐</text><text x="390.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">아니오</text><text x="566.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">아니오</text><text x="742.0" y="159" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">끄거나 조절 가능</text><line x1="16" y1="174" x2="830" y2="174" stroke="#d0d7de"/><text x="22" y="199" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">효과</text><text x="214.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">84명 중 69% 호전 (본인 평가)</text><text x="390.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">좋음 80% + 부분 18%</text><text x="566.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">10명, 12개월 점수 개선</text><text x="742.0" y="199" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">1명, 15개월 유지</text><line x1="16" y1="214" x2="830" y2="214" stroke="#d0d7de"/><text x="22" y="239" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">대표적 대가</text><text x="214.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">주사 근육·주변의 힘 빠짐</text><text x="390.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">영구 부작용 3.5%</text><text x="566.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">발음 장애 1명</text><text x="742.0" y="239" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">수술, 기기 관리</text><line x1="16" y1="254" x2="830" y2="254" stroke="#d0d7de"/><text x="22" y="279" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">연구 설계</text><text x="214.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">후향 84명 · 위약 대조 21명</text><text x="390.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">후향 171명, 비교 없음</text><text x="566.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">전향 10명, 비교 없음</text><text x="742.0" y="279" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">증례 1명, 시험 진행 중</text><line x1="16" y1="294" x2="830" y2="294" stroke="#d0d7de"/><text x="22" y="319" font-size="12.5" text-anchor="start" font-weight="600" fill="#656d76">대표 연구</text><text x="214.0" y="319" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">Schuele 2005 · Frucht 2024</text><text x="390.0" y="319" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">Horisawa 2019</text><text x="566.0" y="319" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">Horisawa 2021</text><text x="742.0" y="319" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1f2328">2023 증례 · NIH 시험</text><line x1="16" y1="334" x2="830" y2="334" stroke="#d0d7de"/><text x="423.0" y="356" font-size="11.5" text-anchor="middle" font-weight="400" fill="#656d76">칸마다 출처가 다르다. 같은 줄의 숫자를 서로 견주지 말 것</text></svg>