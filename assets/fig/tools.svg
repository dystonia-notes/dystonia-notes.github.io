<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="20" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="128" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">깃털 펜 → 강철 펜촉</text><text x="128" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">펜을 깎느라 쉬던 틈이 사라짐</text><text x="128" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▲</text><text x="128" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">필경사의 운동 문제 증가</text><rect x="252" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="360" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">모스 키 → 키보드</text><text x="360" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">도구 자체를 교체</text><text x="360" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▼</text><text x="360" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">교환수 대부분 증상에서 벗어남</text><rect x="484" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="592" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">현악기: 큰 것 → 작은 것</text><text x="592" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">더 높은 공간 정밀도 요구</text><text x="592" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▲</text><text x="592" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">작은 악기일수록 발생률 높음</text><text x="360" y="190" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">Sadnicka 등(2017)이 든 역사적 사례를 정리한 그림</text></svg>