<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="360" y="28" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">수정된 단계적 운동 심상 (mGMI)의 세 단계</text><rect x="24" y="52" width="200" height="110" rx="12" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="124" y="84" font-size="14.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">① 좌우 판별</text><text x="124" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">손의 왼쪽·오른쪽을</text><text x="124" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">가려내는 연습</text><line x1="230" y1="107" x2="254" y2="107" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="260" y="52" width="200" height="110" rx="12" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="360" y="84" font-size="14.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">② 움직임 상상</text><text x="360" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">실제로 움직이지 않고</text><text x="360" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">손의 움직임을 떠올림</text><line x1="466" y1="107" x2="490" y2="107" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="496" y="52" width="200" height="110" rx="12" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="596" y="84" font-size="14.5" text-anchor="middle" font-weight="600" fill="#2f6f6a">③ 거울 피드백</text><text x="596" y="112" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">건강한 손의 거울상을 보며</text><text x="596" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#1f2328">양손으로 같은 동작</text><text x="360" y="192" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">집에서 하루 한 번 · 4주 · 음악가 6명 (Ramella 등 2021)</text><text x="360" y="212" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">단계의 이름은 논문 초록, 거울 단계의 설명은 Grifoni 등(2024)의 기술을 따름</text></svg>