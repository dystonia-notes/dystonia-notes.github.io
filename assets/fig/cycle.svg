<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="190" y="26" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">감각을 바꿔도 돌아오는 이유</text><rect x="95.0" y="46" width="190" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="190" y="71" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">기본값이 된 감각 → 증상</text><rect x="230.0" y="130" width="140" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="300" y="155" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">감각을 바꿈</text><rect x="95.0" y="214" width="190" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="190" y="239" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">증상이 잠시 사라짐</text><rect x="10.0" y="130" width="140" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="80" y="155" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">새 감각이 기본값이 됨</text><line x1="262" y1="86" x2="296" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="296" y1="172" x2="262" y2="214" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="118" y1="214" x2="84" y2="172" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="84" y1="128" x2="118" y2="86" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="396" y1="16" x2="396" y2="266" stroke="#d0d7de" stroke-width="1" /><text x="556" y="26" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">입력의 두 종류</text><rect x="416" y="48" width="280" height="92" rx="10" fill="#f3f5f7" stroke="#d0d7de" strok