<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 208" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="20" y="96" width="152" height="64" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.3" /><text x="96" y="124" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">강한 압박이</text><text x="96" y="143" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">같은 동작과 함께 되풀이됨</text><line x1="174" y1="128" x2="192" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="196" y="96" width="152" height="64" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.3" /><text x="272" y="124" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">뇌가 그 동작을</text><text x="272" y="143" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">위협과 묶어서 기록</text><line x1="350" y1="128" x2="368" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="372" y="96" width="152" height="64" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.3" /><text x="448" y="124" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">몸을 움직이는</text><text x="448" y="143" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">방식이 바뀜</text><line x1="526" y1="128" x2="544" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="548" y="96" width="152" height="64" rx="10" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="1.3" /><text x="624" y="134" font-size="14" text-anchor="middle" font-weight="600" fill="#fff">증상</text><rect x="108" y="16" width="240" height="44" rx="22" fill="#fff" stroke="#2f6f6a" stroke-width="1.3" stroke-dasharray="5 4"/><text x="228" y="43" font-size="13.5" text-anchor="mid