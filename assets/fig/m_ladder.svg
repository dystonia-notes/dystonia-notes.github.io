<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 326" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="126" y="16" width="570" height="56" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/><text x="142" y="40" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">마음을 다루면 운동 증상이 나아지는가</text><text x="142" y="60" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">Bernstein 등 2016: 아홉 편, 73명</text><rect x="506" y="25" width="178" height="24" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1" /><text x="595.0" y="42" font-size="12" text-anchor="middle" font-weight="600" fill="#656d76">시험한 연구가 거의 없음</text><rect x="92" y="86" width="604" height="56" rx="10" fill="#fff" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="5 4"/><text x="108" y="110" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">스트레스가 잘못된 동작을 굳히는가</text><text x="108" y="130" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">Alpheis 등 2023 (가설) · 2024 (뇌 영상에서 확인 안 됨)</text><rect x="506" y="95" width="178" height="24" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1" /><text x="595.0" y="112" font-size="12" text-anchor="middle" font-weight="600" fill="#656d76">가설 · 반대 자료 있음</text><rect x="58" y="156" width="638" height="56" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.2" /><text x="74" y="180" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">병보다 먼저 있었는가, 발병을 앞당기는가</text><text x="74" y="200" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">Lencer 등 2009 · Enders 등 2011 · Ioannou 등 2016</text><rect x="602" y="165" width="82" height="24" rx="12" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1" /><text x="643.0" y="182" font-size="12" text-anchor="middle" font-weight="600" fill="#2f6f6a">일부 근거</text><rect x="24" y="226" width="672" height="56" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.2" /><text x="40" y="250" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">환자에게 불안·완벽주의가 더 흔한가</text><text x="40" y="270" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">Ioannou &amp; Altenmüller 2014 · 단, 환자의 절반 가까이는 해당 없음</text><rect x="554" y="235" width="130" height="24" rx="12" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="1" /><text x="619.0" y="252" font-size="12" text-anchor="middle" font-weight="600" fill="#fff">여러 연구가 확인</text><text x="24" y="314" font-size="12" text-anchor="start" font-weight="400" fill="#656d76">아래가 가장 단단하고, 위로 갈수록 근거가 얇다</text></svg>