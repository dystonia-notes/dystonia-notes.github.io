<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="40" y="30" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">예전 방식: 네 음을 미리 손가락에 붙여 두고 하나씩 누른다</text><rect x="40" y="46" width="330" height="64" rx="10" fill="#fbeee8" stroke="#c4552d" stroke-width="1.3" /><rect x="56" y="60" width="64" height="36" rx="6" fill="#fff" stroke="#c4552d" stroke-width="1.2" /><text x="88" y="83" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">음 1</text><rect x="134" y="60" width="64" height="36" rx="6" fill="#fff" stroke="#c4552d" stroke-width="1.2" /><text x="166" y="83" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">음 2</text><rect x="212" y="60" width="64" height="36" rx="6" fill="#fff" stroke="#c4552d" stroke-width="1.2" /><text x="244" y="83" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">음 3</text><rect x="290" y="60" width="64" height="36" rx="6" fill="#fff" stroke="#c4552d" stroke-width="1.2" /><text x="322" y="83" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">음 4</text><line x1="380" y1="78" x2="430" y2="78" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><text x="440" y="72" font-size="12.5" text-anchor="start" font-weight="600" fill="#c4552d">한 덩어리로 장전되어 통째로 나간다</text><text x="440" y="92" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">덩어리 안의 오류도 함께 불려 나온다</text><text x="40" y="150" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">새 방식: 한 음을 누르고 그 손가락만 남긴다. 나머지는 가장 편한 자리로</text><rect x="40" y="166" width="120" height="64" rx="8" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.3" /><text x="100" y="192" font-size="13" text-anchor="middle" font-weight="600" fill="#2f6f6a">음 1</text><text x="100" y="212" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">단독 명령</text><text x="184" y="203" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">리셋</text><rect x="208" y="166" width="120" height="64" rx="8" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.3" /><text x="268" y="192" font-size="13" text-anchor="middle" font-weight="600" fill="#2f6f6a">음 2</text><text x="268" y="212" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">단독 명령</text><text x="352" y="203" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">리셋</text><rect x="376" y="166" width="120" height="64" rx="8" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.3" /><text x="436" y="192" font-size="13" text-anchor="middle" font-weight="600" fill="#2f6f6a">음 3</text><text x="436" y="212" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">단독 명령</text><text x="520" y="203" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">리셋</text><rect x="544" y="166" width="120" height="64" rx="8" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.3" /><text x="604" y="192" font-size="13" text-anchor="middle" font-weight="600" fill="#2f6f6a">음 4</text><text x="604" y="212" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">단독 명령</text><text x="40" y="256" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">매번 새로 내린 명령으로 친다. 옛 덩어리를 불러내지 않으니 새로 쌓는 느낌이 든다.</text><text x="40" y="300" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">그다음 (이 사이트가 덧붙인 생각): 안정된 단위들로 다시 묶는다</text><rect x="40" y="316" width="330" height="64" rx="10" fill="none" stroke="#2f6f6a" stroke-width="1.3" stroke-dasharray="6 4"/><rect x="56" y="330" width="64" height="36" rx="6" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.2" /><text x="88" y="353" font-size="12.5" text-anchor="middle" font-weight="400" fill="#2f6f6a">음 1</text><rect x="134" y="330" width="64" height="36" rx="6" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.2" /><text x="166" y="353" font-size="12.5" text-anchor="middle" font-weight="400" fill="#2f6f6a">음 2</text><rect x="212" y="330" width="64" height="36" rx="6" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.2" /><text x="244" y="353" font-size="12.5" text-anchor="middle" font-weight="400" fill="#2f6f6a">음 3</text><rect x="290" y="330" width="64" height="36" rx="6" fill="#e6f1f0" stroke="#2f6f6a" stroke-width="1.2" /><text x="322" y="353" font-size="12.5" text-anchor="middle" font-weight="400" fill="#2f6f6a">음 4</text><line x1="380" y1="348" x2="430" y2="348" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><text x="440" y="342" font-size="12.5" text-anchor="start" font-weight="600" fill="#2f6f6a">미리 붙여 두는 준비를 조금씩 다시 들인다</text><text x="440" y="362" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">이번에는 오류 없는 단위로 묶음을 짠다</text></svg>