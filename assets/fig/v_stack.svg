<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="130" y="20" width="566" height="64" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1.5" /><text x="116" y="58" font-size="14.5" text-anchor="end" font-weight="600" fill="#1f2328">결과</text><text x="150" y="48" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">감각 지도가 따라서 정리된다</text><text x="150" y="69" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">손가락 자리가 다시 나뉨 (감각 주제)</text><line x1="413" y1="104" x2="413" y2="88" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="130" y="106" width="566" height="64" rx="12" fill="#2f6f6a" stroke="#2f6f6a" stroke-width="1.5" /><text x="116" y="144" font-size="14.5" text-anchor="end" font-weight="600" fill="#2f6f6a">행동 강령</text><text x="150" y="134" font-size="14" text-anchor="start" font-weight="600" fill="#fff">그 범위 안에서 손을 보면서 동작을 형성한다</text><text x="150" y="155" font-size="12.5" text-anchor="start" font-weight="400" fill="#e6f1f0">시각 피드백 — 결과만이 아니라 과정을 확인</text><line x1="413" y1="190" x2="413" y2="174" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" /><rect x="130" y="192" width="566" height="64" rx="12" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1.5" /><text x="116" y="230" font-size="14.5" text-anchor="end" font-weight="600" fill="#2f6f6a">최소 조건</text><text x="150" y="220" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">증상이 나오지 않는 범위에 머문다</text><text x="150" y="241" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">BATR · The Mindful Pianist가 말하는 것</text><text x="360" y="294" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">유별의 가설을 그린 모식도 — 