<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><line x1="70" y1="30" x2="70" y2="190" stroke="#656d76" stroke-width="1" /><line x1="70" y1="190" x2="690" y2="190" stroke="#656d76" stroke-width="1" /><text x="78" y="46" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">증상</text><text x="690" y="210" font-size="12.5" text-anchor="end" font-weight="400" fill="#656d76">시간 →</text><line x1="70" y1="70" x2="690" y2="70" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/><text x="684" y="62" font-size="12" text-anchor="end" font-weight="400" fill="#656d76">원래 수준</text><path d="M70 70 H190 C215 70 215 160 250 160 H330 C420 160 470 74 560 72 H690" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linecap="round"/><line x1="190" y1="30" x2="190" y2="190" stroke="#656d76" stroke-width="1" stroke-dasharray="2 3"/><text x="190" y="24" font-size="12.5" text-anchor="middle" font-weight="600" fill="#1f2328">감각을 바꿈 (도구 착용 · 주사)</text><text x="300" y="181" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">① 낯선 감각: 증상이 숨음</text><text x="512" y="150" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">② 몸이 새 감각에 적응</text><text x="610" y="96" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">③ 새 감각 위로 증상 복귀</text><text x="360" y="238" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">모식도 — 측정값이 아니라 유별이 겪은 흐름을 그린 것</text><text x="360" y="258" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">보톡스의 경우: 약 1주간 덜함 → 약 2주 뒤부터 복귀 (본인 기록)</text></svg>