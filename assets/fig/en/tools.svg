<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="20" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="128" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">Quill → steel nib</text><text x="128" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">sharpening breaks vanished</text><text x="128" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▲</text><text x="128" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">more motor problems in clerks</text><rect x="252" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="360" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">Morse key → keyboard</text><text x="360" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">the tool itself replaced</text><text x="360" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▼</text><text x="360" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">most telegraphists recovered</text><rect x="484" y="16" width="216" height="150" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="592" y="46" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">Strings: large → small</text><text x="592" y="70" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">finer spatial precision needed</text><text x="592" y="112" font-size="26" text-anchor="middle" font-weight="700" fill="#1f2328">▲</text><text x="592" y="144" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">higher incidence when smaller</text><text x="360" y="190" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">Historical examples cited by Sadnicka et al. (2017)</text></svg>