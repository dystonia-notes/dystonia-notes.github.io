<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="190" y="26" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">Why symptoms return</text><rect x="95.0" y="46" width="190" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="190" y="71" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">Default sensation → symptom</text><rect x="230.0" y="130" width="140" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="300" y="155" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">Sensation changed</text><rect x="95.0" y="214" width="190" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="190" y="239" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">Symptoms fade briefly</text><rect x="10.0" y="130" width="140" height="40" rx="20" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="80" y="155" font-size="12.5" text-anchor="middle" font-weight="500" fill="#1f2328">Becomes the default</text><line x1="262" y1="86" x2="296" y2="128" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="296" y1="172" x2="262" y2="214" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="118" y1="214" x2="84" y2="172" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="84" y1="128" x2="118" y2="86" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)"/><line x1="396" y1="16" x2="396" y2="266" stroke="#d0d7de" stroke-width="1" /><text x="556" y="26" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">Two kinds of input</text><rect x="416" y="48" width="280" height="92" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><path d="M436 82 H536" stroke="#9aa0a6" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="550" y="87" font-size="13.5" text-anchor="start" font-weight="600" fill="#1f2328">Constant input</text><text x="436" y="112" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2328">splint · tape · toxin · mirror</text><text x="436" y="130" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">soon absorbed as background</text><rect x="416" y="158" width="280" height="92" rx="10" fill="#e6f1ef" stroke="#2f6f6a" stroke-width="1.5" /><path d="M436 192 q12.5 -22 25 0 t25 0 t25 0 t25 0" stroke="#2f6f6a" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="550" y="197" font-size="13.5" text-anchor="start" font-weight="600" fill="#1f2328">Varying input</text><text x="436" y="222" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f2328">hands-on touch · varied practice</text><text x="436" y="240" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">stays a learning signal (hypothesis)</text></svg>