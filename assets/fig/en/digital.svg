<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="310" y="30" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2328">Touch (fingertips)</text><text x="560" y="30" font-size="14" text-anchor="middle" font-weight="600" fill="#1f2328">Sound</text><text x="170" y="86" font-size="14" text-anchor="end" font-weight="600" fill="#1f2328">Acoustic piano</text><rect x="195" y="46" width="230" height="70" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="310" y="76" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">key weight and string vibration</text><text x="310" y="96" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">reach the fingertips</text><rect x="445" y="46" width="230" height="70" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="560" y="86" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">sound of the strings themselves</text><text x="170" y="172" font-size="14" text-anchor="end" font-weight="600" fill="#1f2328">Digital piano</text><rect x="195" y="132" width="230" height="70" rx="10" fill="#fdf1ea" stroke="#eb6834" stroke-width="1.5" /><text x="310" y="162" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">key feel subtly different</text><text x="310" y="182" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">no string vibration</text><rect x="366" y="122" width="58" height="20" rx="10" fill="#eb6834" stroke="none" stroke-width="1" /><text x="395" y="136" font-size="11.5" text-anchor="middle" font-weight="600" fill="#fff">changed</text><rect x="445" y="132" width="230" height="70" rx="10" fill="#fdf1ea" stroke="#eb6834" stroke-width="1.5" /><text x="560" y="162" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">recorded samples</text><text x="560" y="182" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1f2328">played through speakers</text><rect x="616" y="122" width="58" height="20" rx="10" fill="#eb6834" stroke="none" stroke-width="1" /><text x="645" y="136" font-size="11.5" text-anchor="middle" font-weight="600" fill="#fff">changed</text><rect x="60" y="226" width="600" height="40" rx="20" fill="#fff" stroke="#d0d7de" stroke-width="1" /><text x="360" y="251" font-size="13" text-anchor="middle" font-weight="500" fill="#1f2328">Attention on the left hand — the right runs on autopilot, relying on these two senses</text></svg>