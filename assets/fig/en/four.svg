<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><rect x="30" y="24" width="150" height="70" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="105" y="54" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">Task</text><text x="105" y="76" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">what, and how precisely</text><rect x="200" y="24" width="150" height="70" rx="10" fill="#e6f1ef" stroke="#2f6f6a" stroke-width="2" /><text x="275" y="54" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">Tool</text><text x="275" y="76" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">instrument, pen, keys</text><rect x="370" y="24" width="150" height="70" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="445" y="54" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">Periphery</text><text x="445" y="76" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">the hand and body</text><rect x="540" y="24" width="150" height="70" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="615" y="54" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">CNS</text><text x="615" y="76" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">how the skill is stored</text><path d="M30 112h320" stroke="#656d76" stroke-width="1.5" fill="none"/><path d="M370 112h320" stroke="#656d76" stroke-width="1.5" fill="none"/><text x="190" y="134" font-size="13" text-anchor="middle" font-weight="500" fill="#1f2328">Demand: set by task and tool</text><text x="530" y="134" font-size="13" text-anchor="middle" font-weight="500" fill="#1