<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="190" y="28" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">훈련 방법 (논문에 실린 예시)</text><rect x="28" y="60" width="44" height="120" rx="22" fill="#2a78d6" stroke="#fff" stroke-width="2" fill-opacity=".85"/><text x="50" y="52" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">D1</text><rect x="98" y="60" width="44" height="120" rx="22" fill="#e3e6ea" stroke="#8b949e" stroke-width="2" stroke-dasharray="4 3"/><text x="120" y="52" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">D2</text><text x="120" y="200" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">부목 고정</text><rect x="168" y="60" width="44" height="120" rx="22" fill="#1baf7a" stroke="#fff" stroke-width="2" fill-opacity=".85"/><text x="190" y="52" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">D3</text><text x="190" y="200" font-size="12" text-anchor="middle" font-weight="600" fill="#1f2328">증상 손가락</text><rect x="238" y="60" width="44" height="120" rx="22" fill="#eda100" stroke="#fff" stroke-width="2" fill-opacity=".85"/><text x="260" y="52" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">D4</text><rect x="308" y="60" width="44" height="120" rx="22" fill="#e87ba4" stroke="#fff" stroke-width="2" fill-opacity=".85"/><text x="330" y="52" font-size="13" text-anchor="middle" font-weight="600" fill="#1f2328">D5</text><path d="M190 222 Q225 250 260 222 M260 222 Q295 250 330 222" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="260" y="268" font-size="12.5" text-anchor="middle" font-weight="400" fill="#656d76">D3 → D4 → D5 → D4 … 순서대로 번갈아 움직임</text><line x1="400" y1="20" x2="400" y2="280" stroke="#d0d7de" stroke-width="1" /><text x="560" y="28" font-size="15" text-anchor="middle" font-weight="600" fill="#1f2328">일정과 측정</text><rect x="430" y="52" width="260" height="60" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="560" y="78" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">8일 연속</text><text x="560" y="98" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">치료사 감독 아래</text><rect x="430" y="126" width="260" height="60" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="560" y="152" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">하루 1.5–2.5시간</text><text x="560" y="172" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">한 동작 조합을 10분씩</text><rect x="430" y="200" width="260" height="60" rx="10" fill="#f3f5f7" stroke="#d0d7de" stroke-width="1" /><text x="560" y="226" font-size="14.5" text-anchor="middle" font-weight="600" fill="#1f2328">전후에 뇌자도 측정</text><text x="560" y="246" font-size="12" text-anchor="middle" font-weight="400" fill="#656d76">양손 모든 손가락의 지도</text></svg>