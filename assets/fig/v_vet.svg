<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" font-family='-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#656d76"/></marker></defs><text x="24" y="26" font-size="14" text-anchor="start" font-weight="600" fill="#1f2328">촉각이 얼마나 또렷한가 (두 점을 가려내는 능력)</text><text x="234" y="67" font-size="13.5" text-anchor="end" font-weight="500" fill="#1f2328">팔이 보이지 않음</text><line x1="250" y1="62" x2="590" y2="62" stroke="#d0d7de" stroke-width="2" /><circle cx="352.0" cy="62" r="8" fill="#9aa0a6" stroke="#fff" stroke-width="2"/><text x="604" y="67" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">기준</text><text x="234" y="107" font-size="13.5" text-anchor="end" font-weight="500" fill="#1f2328">팔 자리에 다른 물체가 보임</text><line x1="250" y1="102" x2="590" y2="102" stroke="#d0d7de" stroke-width="2" /><circle cx="352.0" cy="102" r="8" fill="#9aa0a6" stroke="#fff" stroke-width="2"/><text x="604" y="107" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">기준과 같음</text><text x="234" y="147" font-size="13.5" text-anchor="end" font-weight="500" fill="#1f2328">자기 팔이 보임</text><line x1="250" y1="142" x2="590" y2="142" stroke="#d0d7de" stroke-width="2" /><circle cx="460.8" cy="142" r="8" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="604" y="147" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">더 또렷함</text><text x="234" y="187" font-size="13.5" text-anchor="end" font-weight="500" fill="#1f2328">자기 팔이 확대되어 보임</text><line x1="250" y1="182" x2="590" y2="182" stroke="#d0d7de" stroke-width="2" /><circle cx="542.4" cy="182" r="8" fill="#2a78d6" stroke="#fff" stroke-width="2"/><text x="604" y="187" font-size="12.5" text-anchor="start" font-weight="400" fill="#656d76">가장 또렷함</text><line x1="250" y1="214" x2="590" y2="214" strok